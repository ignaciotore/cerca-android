name: Aplicar identidad H.E.L.P y preparar publicación

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/aplicar-help-publicacion.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Integrar logo H.E.L.P aprobado
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          printf '%s' '' | base64 -d > app/src/main/res/drawable/help_icon.png

          mkdir -p play-assets
          printf '%s' '' | base64 -d > play-assets/icon-512.png

          printf '%s' '' | base64 -d > app/src/main/AndroidManifest.xml

      - name: Guardar textos y checklist de publicación
        shell: bash
        run: |
          set -e
          mkdir -p docs play-assets
          printf '%s' '' | base64 -d > docs/play-store-listing.md
          printf '%s' '' | base64 -d > docs/privacy-policy-draft.md
          printf '%s' '' | base64 -d > play-assets/README.md

      - name: Verificar identidad aplicada
        shell: bash
        run: |
          set -e
          test -s app/src/main/res/drawable/help_icon.png
          test -s play-assets/icon-512.png
          grep -q 'android:icon="@drawable/help_icon"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="H.E.L.P"' app/src/main/AndroidManifest.xml
          grep -q 'maps.google.com' app/src/main/java/com/cerca/mvp/MainActivity.kt
          test ! -f app/src/main/java/com/cerca/mvp/LocationSharingService.kt

      - name: Compilar APK y AAB de validación
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Guardar cambios en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/res/drawable/help_icon.png play-assets docs
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos para guardar."
          else
            git commit -m "Integrar identidad visual H.E.L.P y materiales de publicación"
            git push
          fi

      - name: Subir APK y AAB actualizados
        uses: actions/upload-artifact@v4
        with:
          name: HELP-IDENTIDAD-APROBADA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
            play-assets/icon-512.png
            docs/play-store-listing.md
            docs/privacy-policy-draft.md
          if-no-files-found: error
