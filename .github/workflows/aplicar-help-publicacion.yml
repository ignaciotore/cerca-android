name: Aplicar identidad H.E.L.P y preparar publicación

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/aplicar-help-publicacion.yml"
      - ".github/workflows/help-logo.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Instalar herramientas de imagen
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Aplicar logo oficial H.E.L.P
        shell: bash
        run: |
          set -e
          LOGO=".github/workflows/help-logo.png"
          test -f "$LOGO"

          # Íconos Android usando exactamente el logo aprobado.
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi \
                   app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi \
                   app/src/main/res/mipmap-xxxhdpi
          convert "$LOGO" -resize 48x48!   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$LOGO" -resize 72x72!   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$LOGO" -resize 96x96!   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$LOGO" -resize 144x144! app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$LOGO" -resize 192x192! app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Guardar identidad oficial dentro del proyecto.
          mkdir -p branding play-store docs
          cp "$LOGO" branding/help-logo-oficial.png
          convert "$LOGO" -resize 512x512! -strip play-store/icon-512.png

          # Feature graphic simple, sin pantallas inventadas ni datos personales.
          convert -size 1024x500 xc:'#FAF7F2' \
            \( "$LOGO" -resize 330x330 \) -geometry +70+85 -composite \
            -font DejaVu-Sans-Bold -fill '#173B46' -pointsize 88 -gravity northwest \
            -annotate +470+155 'H.E.L.P' \
            -font DejaVu-Sans -fill '#667078' -pointsize 36 \
            -annotate +474+270 'Ayuda cuando la necesitás' \
            -strip play-store/feature-graphic-1024x500.png

          # Manifest: conservar permisos/funcionalidad y agregar icono oficial.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon=' not in s:
              s = s.replace('<application\n', '<application\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n', 1)
          else:
              import re
              s = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', s)
              if 'android:roundIcon=' in s:
                  s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
              else:
                  s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PY

          # Subir versión de esta actualización visual sin cambiar package ID ni lógica.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 5', 'versionCode = 6')
          s = s.replace('versionName = "5.0"', 'versionName = "5.1"')
          p.write_text(s)
          PY

          cat > docs/play-store-listing.md <<'EOF'
          # H.E.L.P — ficha de Google Play

          **Nombre:** H.E.L.P

          **Descripción corta:** Pedí ayuda rápidamente con llamada y SMS con tu ubicación de Google Maps.

          **Descripción larga:**
          H.E.L.P es una aplicación de seguridad personal pensada para actuar de forma simple cuando necesitás pedir ayuda.

          Configurás previamente una persona para la llamada y hasta cuatro contactos para recibir avisos por SMS. Al mantener presionado el botón PEDIR AYUDA durante 3 segundos, H.E.L.P obtiene tu ubicación actual, envía un SMS con un enlace puntual de Google Maps a los contactos configurados y realiza la llamada de ayuda.

          Funciones principales:
          - Botón de ayuda con activación mantenida para evitar pulsaciones accidentales.
          - Llamada directa al contacto configurado.
          - Aviso por SMS a hasta cuatro contactos.
          - Enlace puntual de Google Maps con la ubicación del momento.
          - Selección de contactos desde la agenda del teléfono.
          - Perfil editable.
          - Prueba gratuita de 30 días en la versión actual.

          H.E.L.P no realiza seguimiento de ubicación en tiempo real ni comparte tu ubicación de forma continua.
          EOF

          cat > docs/privacy-policy-draft.md <<'EOF'
          # Política de privacidad de H.E.L.P — borrador

          H.E.L.P utiliza permisos de teléfono, SMS y ubicación únicamente para ejecutar las funciones de seguridad solicitadas por el usuario.

          ## Datos utilizados
          - Datos de perfil ingresados por el usuario.
          - Contactos de emergencia seleccionados por el usuario.
          - Ubicación puntual obtenida al activar el pedido de ayuda.

          ## Uso de la ubicación
          La ubicación se obtiene cuando el usuario activa PEDIR AYUDA. Se utiliza para generar un enlace de Google Maps que se incluye en el SMS enviado a los contactos configurados. H.E.L.P no realiza seguimiento de ubicación en tiempo real ni continuo.

          ## SMS y llamadas
          H.E.L.P utiliza el permiso de SMS para enviar el aviso de ayuda a los contactos configurados y el permiso de teléfono para iniciar la llamada al contacto seleccionado.

          ## Contactos
          La selección de contactos se realiza mediante el selector de contactos del sistema Android. H.E.L.P guarda localmente el nombre y número elegidos para poder ejecutar la función de ayuda.

          ## Almacenamiento actual
          En la versión de prueba actual los datos de configuración se almacenan localmente en el dispositivo. Antes de la comercialización definitiva, cualquier servicio de cuenta o suscripción conectado a servidores deberá quedar reflejado en esta política.

          ## Contacto
          El correo de soporte definitivo se completará antes de la publicación pública.
          EOF

      - name: Verificar identidad y funcionalidad existente
        shell: bash
        run: |
          set -e
          grep -q 'android:label="H.E.L.P"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SEND_SMS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CALL_PHONE' app/src/main/AndroidManifest.xml
          grep -q 'maps.google.com' app/src/main/java/com/cerca/mvp/MainActivity.kt
          grep -q 'ContactsContract.CommonDataKinds.Phone.CONTENT_URI' app/src/main/java/com/cerca/mvp/MainActivity.kt
          test ! -f app/src/main/java/com/cerca/mvp/LocationSharingService.kt
          test -f play-store/icon-512.png
          test -f play-store/feature-graphic-1024x500.png

      - name: Compilar APK y AAB de prueba
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Guardar cambios en main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/res app/build.gradle.kts branding play-store docs
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos para guardar."
          else
            git commit -m "Integrar logo oficial H.E.L.P y preparar publicación"
            git push origin main
          fi

      - name: Subir APK AAB y assets
        uses: actions/upload-artifact@v4
        with:
          name: HELP-V5-1-IDENTIDAD-OFICIAL
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
            play-store/icon-512.png
            play-store/feature-graphic-1024x500.png
            branding/help-logo-oficial.png
            docs/play-store-listing.md
            docs/privacy-policy-draft.md
