name: Aplicar H.E.L.P V5 y compilar

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/aplicar-help-v5.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36"

      - name: Aplicar H.E.L.P V5
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'build.gradle.kts')"
          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjExLjEiIGFwcGx5IGZhbHNlCiAgICBpZCgib3JnLmpldGJyYWlucy5rb3RsaW4uYW5kcm9pZCIpIHZlcnNpb24gIjIuMS4yMCIgYXBwbHkgZmFsc2UKfQo=' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          printf '%s' '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'docs/play-store-listing.md')"
          printf '%s' '' | base64 -d > 'docs/play-store-listing.md'
          mkdir -p "$(dirname 'docs/privacy-policy-draft.md')"
          printf '%s' '' | base64 -d > 'docs/privacy-policy-draft.md'
          mkdir -p "$(dirname 'gradle/wrapper/gradle-wrapper.properties')"
          printf '%s' '' | base64 -d > 'gradle/wrapper/gradle-wrapper.properties'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/layout/activity_main.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/res/layout/activity_main.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/card_bg.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/res/drawable/card_bg.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/primary_button.xml')"
          printf '%s' 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzE3M0I0NiIvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjE4ZHAiLz4KPC9zaGFwZT4=' | base64 -d > 'app/src/main/res/drawable/primary_button.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/danger_circle.xml')"
          printf '%s' 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIgYW5kcm9pZDpzaGFwZT0ib3ZhbCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iI0Q5NUY1MiIvPgo8L3NoYXBlPg==' | base64 -d > 'app/src/main/res/drawable/danger_circle.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/soft_bg.xml')"
          printf '%s' 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iI0YxRUNFNSIvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjE4ZHAiLz4KPC9zaGFwZT4=' | base64 -d > 'app/src/main/res/drawable/soft_bg.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/input_bg.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/res/drawable/input_bg.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/secondary_button.xml')"
          printf '%s' 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iI0VFRThFMCIvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjE4ZHAiLz4KICAgIDxzdHJva2UgYW5kcm9pZDp3aWR0aD0iMWRwIiBhbmRyb2lkOmNvbG9yPSIjREVENUNBIi8+Cjwvc2hhcGU+' | base64 -d > 'app/src/main/res/drawable/secondary_button.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/badge_bg.xml')"
          printf '%s' 'PHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iI0U4RjJFRCIvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjQwZHAiLz4KPC9zaGFwZT4=' | base64 -d > 'app/src/main/res/drawable/badge_bg.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/cerca/mvp/MainActivity.kt')"
          printf '%s' '' | base64 -d > 'app/src/main/java/com/cerca/mvp/MainActivity.kt'
          rm -f app/src/main/java/com/cerca/mvp/LocationSharingService.kt

      - name: Verificar versión
        shell: bash
        run: |
          set -e
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "5.0"' app/build.gradle.kts
          grep -q 'android:label="H.E.L.P"' app/src/main/AndroidManifest.xml
          grep -q 'maps.google.com' app/src/main/java/com/cerca/mvp/MainActivity.kt
          grep -q 'ContactsContract.CommonDataKinds.Phone.CONTENT_URI' app/src/main/java/com/cerca/mvp/MainActivity.kt
          test ! -f app/src/main/java/com/cerca/mvp/LocationSharingService.kt

      - name: Compilar APK y AAB de prueba
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Guardar cambios en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts gradle/wrapper/gradle-wrapper.properties app docs
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "H.E.L.P V5: contactos, Google Maps y nuevo diseño"
            git push
          fi

      - name: Subir APK y AAB de prueba
        uses: actions/upload-artifact@v4
        with:
          name: HELP-V5-TEST
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
