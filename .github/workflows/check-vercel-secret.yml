name: Comprobar credencial Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-vercel-secret.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Verificar secretos sin exponerlos
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN=PRESENT"; else echo "VERCEL_TOKEN=ABSENT"; fi
          if [ -n "$VERCEL_ACCESS_TOKEN" ]; then echo "VERCEL_ACCESS_TOKEN=PRESENT"; else echo "VERCEL_ACCESS_TOKEN=ABSENT"; fi
          if [ -n "$VERCEL_API_TOKEN" ]; then echo "VERCEL_API_TOKEN=PRESENT"; else echo "VERCEL_API_TOKEN=ABSENT"; fi
