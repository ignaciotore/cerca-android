name: Deploy CERCA Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "cerca-web/**"
      - ".github/workflows/deploy-cerca-web-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerca-web-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar CERCA en Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: cerca-seguridad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar credenciales Cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en GitHub Actions Secrets."
            exit 1
          fi

      - name: Instalar Wrangler
        run: npm install --global wrangler@4

      - name: Crear proyecto Pages si todavía no existe
        shell: bash
        run: |
          wrangler pages project create "$PROJECT_NAME" --production-branch main || true

      - name: Publicar CERCA en producción
        run: >
          wrangler pages deploy cerca-web
          --project-name "$PROJECT_NAME"
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.event.head_commit.message || 'Deploy CERCA Web' }}"

      - name: Mostrar URL productiva
        run: |
          echo "CERCA productiva: https://$PROJECT_NAME.pages.dev"
