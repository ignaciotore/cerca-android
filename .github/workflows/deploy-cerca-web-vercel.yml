name: Deploy CERCA Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "cerca-web/**"
      - ".github/workflows/deploy-cerca-web-vercel.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy CERCA Web
        run: vercel deploy --prod --yes --cwd cerca-web --token="${{ secrets.VERCEL_TOKEN }}"