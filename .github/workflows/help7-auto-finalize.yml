name: Finalizar H.E.L.P 7.0

on:
  push:
    paths:
      - ".github/workflows/help7-auto-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Descargar código final preparado
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://yduoxeqgxolkzvjexlqk.supabase.co/functions/v1/help-code-payload" \
            -o /tmp/help7.tar.gz
          test -s /tmp/help7.tar.gz
          rm -rf app/src/main/java/com/cerca
          rm -f docs/privacy-policy-draft.md docs/google-play-data-safety.md docs/sms-permission-declaration.md docs/subscription-setup.md docs/release-checklist.md
          tar -xzf /tmp/help7.tar.gz -C .
          git rm -r --cached app/build >/dev/null 2>&1 || true

      - name: Validaciones estáticas
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.help.seguridad"' app/build.gradle.kts
          grep -q 'versionName = "7.0"' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'class SupabaseApi' app/src/main/java/com/help/seguridad/SupabaseApi.kt
          grep -q 'google-play-entitlement' app/src/main/java/com/help/seguridad/SupabaseApi.kt
          grep -q 'ActivationQueue' app/src/main/java/com/help/seguridad/MainActivity.kt
          grep -q 'deleteAccount' app/src/main/java/com/help/seguridad/MainActivity.kt
          grep -q 'RECEIVER_NOT_EXPORTED' app/src/main/java/com/help/seguridad/MainActivity.kt
          grep -q 'trial_ends_at' app/src/main/java/com/help/seguridad/SupabaseApi.kt
          grep -q 'trustedNowMs' app/src/main/java/com/help/seguridad/MainActivity.kt
          ! grep -q 'fallback_trial' app/src/main/java/com/help/seguridad/MainActivity.kt

      - name: Compilar APK y AAB
        shell: bash
        run: gradle :app:assembleDebug :app:bundleDebug :app:bundleRelease --stacktrace

      - name: Guardar código final en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app/build.gradle.kts app/src/main docs
          git add -u docs app/src/main app/build || true
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Finalizar H.E.L.P 7.0 antes de Google Play"
            git push origin HEAD:main
          fi

      - name: Preparar paquete
        shell: bash
        run: |
          rm -rf final-package
          mkdir -p final-package
          cp app/build/outputs/apk/debug/app-debug.apk final-package/H.E.L.P_7.0_PRUEBA.apk
          cp app/build/outputs/bundle/debug/app-debug.aab final-package/H.E.L.P_7.0_DEBUG.aab
          cp app/build/outputs/bundle/release/app-release.aab final-package/H.E.L.P_7.0_RELEASE_SIN_FIRMA.aab
          (cd final-package && sha256sum H.E.L.P_7.0_PRUEBA.apk H.E.L.P_7.0_DEBUG.aab H.E.L.P_7.0_RELEASE_SIN_FIRMA.aab > SHA256SUMS.txt)
          cp -r docs final-package/docs
          [ -f play-store/icon-512.png ] && cp play-store/icon-512.png final-package/ || true
          [ -f play-store/feature-graphic-1024x500.png ] && cp play-store/feature-graphic-1024x500.png final-package/ || true

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: HELP-7-FINAL-PRE-GOOGLE
          path: final-package
          if-no-files-found: error
          retention-days: 90
