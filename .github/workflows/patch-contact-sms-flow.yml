name: Patch CERCA contact SMS flow

on:
  push:

permissions:
  contents: write

jobs:
  patch-and-build:
    if: contains(github.event.head_commit.message, 'Run SMS flow patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Patch contact and SMS flow
        run: python3 .github/scripts/patch_contact_sms_flow.py

      - name: Build Android
        run: gradle assembleDebug --stacktrace

      - name: Commit patch
        run: |
          git config user.name "CERCA automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/help/seguridad/MainActivity.kt app/src/main/java/com/help/seguridad/FamilyCircleActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Corregir llamada SMS ubicación e información útil"
          git push origin HEAD:main
