name: Align CERCA notification UI

on:
  push:
    paths:
      - '.github/workflows/patch-notification-ui.yml'
      - '.github/scripts/patch_notification_ui.py'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Patch notification UI
        run: python3 .github/scripts/patch_notification_ui.py
      - name: Build Android
        run: gradle assembleDebug --stacktrace
      - name: Commit UI cleanup
        run: |
          git config user.name "CERCA automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/help/seguridad/MainActivity.kt app/src/main/res/layout/activity_main.xml
          git diff --cached --quiet && exit 0
          git commit -m "Alinear interfaz Android con notificaciones CERCA"
          git push origin HEAD:main
