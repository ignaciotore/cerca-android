                keyAlias = System.getenv("HELP_KEY_ALIAS")
                keyPassword = System.getenv("HELP_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        getByName("release") {
            isMinifyEnabled = false
            if (!helpKeystorePath.isNullOrBlank()) {
                signingConfig = signingConfigs.getByName("helpRelease")
            }
        }
    }

'''
