          s = gradle.read_text()

          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.help.seguridad"', s)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.help.seguridad"', s)
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 7', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "6.0"', s)

          if 'com.android.billingclient:billing:9.1.0' not in s:
              marker = 'implementation("com.google.android.gms:play-services-location:21.3.0")'
              if marker not in s:
                  raise SystemExit("No encontré el bloque de dependencias esperado")
              s = s.replace(
                  marker,
                  marker + '\n    implementation("com.android.billingclient:billing:9.1.0")'
              )

