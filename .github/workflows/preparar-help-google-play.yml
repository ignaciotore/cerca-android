name: Preparar H.E.L.P para Google Play

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/preparar-help-google-play.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Preparar package, Billing, privacidad y Play Console
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/help-prep app/src/main/java/com/help/seguridad docs .github/workflows
          printf '%s' '' | base64 -d > /tmp/help-prep/patch_help.py
          printf '%s' '' | base64 -d > app/src/main/java/com/help/seguridad/BillingManager.kt
          printf '%s' '' | base64 -d > docs/privacy.html
          printf '%s' '' | base64 -d > docs/google-play-data-safety.md
          printf '%s' '' | base64 -d > docs/sms-permission-declaration.md
          printf '%s' '' | base64 -d > docs/subscription-setup.md
          printf '%s' '' | base64 -d > docs/play-console-answers.md
          printf '%s' '' | base64 -d > docs/release-checklist.md
          python3 /tmp/help-prep/patch_help.py

      - name: Verificar preparación
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'namespace = "com.help.seguridad"' app/build.gradle.kts
          grep -q 'applicationId = "com.help.seguridad"' app/build.gradle.kts
          grep -q 'versionCode = 7' app/build.gradle.kts
          grep -q 'versionName = "6.0"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'com.android.billingclient:billing:9.1.0' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'package com.help.seguridad' app/src/main/java/com/help/seguridad/MainActivity.kt
          grep -q 'SUBSCRIPTION_PRODUCT_ID = "help_monthly"' app/src/main/java/com/help/seguridad/BillingManager.kt
          grep -q 'Physical safety / emergency alerts' docs/sms-permission-declaration.md
          grep -q 'android.permission.SEND_SMS' app/src/main/AndroidManifest.xml
          test ! -f app/src/main/java/com/cerca/mvp/MainActivity.kt
          test -f docs/privacy.html
          test -f .github/workflows/release-help-play.yml
          test -f play-store/icon-512.png
          test -f play-store/feature-graphic-1024x500.png

      - name: Compilar H.E.L.P 6.0 de validación
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Guardar preparación en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java docs
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Preparar H.E.L.P 6.0 para Google Play"
            git push origin main
          fi

      - name: Subir paquete de validación
        uses: actions/upload-artifact@v4
        with:
          name: HELP-V6-PREPARADO-GOOGLE-PLAY
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
            play-store/icon-512.png
            play-store/feature-graphic-1024x500.png
            docs/privacy.html
            docs/google-play-data-safety.md
            docs/sms-permission-declaration.md
            docs/subscription-setup.md
            docs/play-console-answers.md
            docs/release-checklist.md
