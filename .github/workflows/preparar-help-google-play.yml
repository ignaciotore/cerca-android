            <title>Política de privacidad — H.E.L.P</title>
            <style>
              body{font-family:Arial,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#263238;line-height:1.6}
              h1,h2{color:#173B46}.box{background:#FAF7F2;border-radius:16px;padding:18px}
            </style>
          </head>
          <body>
            <h1>Política de privacidad de H.E.L.P</h1>
            <p>Última actualización: 15 de agosto de 2026.</p>
            <div class="box"><p>H.E.L.P es una aplicación de seguridad personal que permite enviar un aviso de emergencia por SMS con una ubicación puntual y realizar una llamada al contacto configurado por el usuario.</p></div>
            <h2>Datos utilizados</h2>
            <p>La aplicación utiliza los datos de perfil ingresados por el usuario, los contactos de emergencia elegidos y la ubicación puntual obtenida cuando el usuario activa PEDIR AYUDA.</p>
            <h2>Ubicación</h2>
            <p>La ubicación se obtiene únicamente al activar PEDIR AYUDA para generar un enlace de Google Maps incluido en el SMS. H.E.L.P no realiza seguimiento de ubicación en tiempo real ni en segundo plano.</p>
            <h2>SMS y llamadas</h2>
            <p>El permiso de SMS se utiliza únicamente para enviar alertas de emergencia a los contactos seleccionados por el usuario. H.E.L.P no lee mensajes SMS. El permiso de teléfono se utiliza para iniciar la llamada al contacto elegido.</p>
            <h2>Contactos</h2>
            <p>Los contactos se seleccionan mediante el selector del sistema Android. La aplicación guarda localmente el nombre y número seleccionados para ejecutar la función de ayuda.</p>
            <h2>Almacenamiento</h2>
            <p>Los datos de configuración se almacenan localmente en el dispositivo. La versión actual no envía el perfil, los contactos ni la ubicación a servidores propios del desarrollador.</p>
            <h2>Google Play</h2>
            <p>Las suscripciones se procesan mediante Google Play Billing. H.E.L.P no accede a los datos de tarjetas del usuario.</p>
            <h2>Eliminación</h2>
            <p>Los datos locales de H.E.L.P pueden eliminarse borrando los datos de la aplicación o desinstalándola.</p>
            <h2>Contacto</h2>
            <p>Correo del desarrollador: ignacio.tore.deymonnaz@gmail.com</p>
          </body>
          </html>
          HTML

          cat > docs/google-play-data-safety.md <<'EOF'
          # H.E.L.P — guía para Seguridad de los datos (Play Console)

          Preparado para la versión 6.0.

          ## Comportamiento actual
          - Nombre, email y teléfono del usuario: almacenados localmente.
          - Contactos de emergencia: seleccionados por el usuario y almacenados localmente.
          - Ubicación: se obtiene solo al activar PEDIR AYUDA.
          - La ubicación se comparte por SMS únicamente por una acción iniciada por el usuario.
          - No existe seguimiento de ubicación continuo.
          - No se leen SMS ni registros de llamadas.
          - No se envían esos datos a un servidor propio.
          - Las compras se procesan mediante Google Play Billing; la app no accede a la tarjeta.

          ## Criterio para el formulario
          Google Play define "recopilar" como transmitir datos fuera del dispositivo. El procesamiento exclusivamente local no se declara como recopilación.
          Google Play también contempla excepciones de "uso compartido" cuando la transferencia es una acción específica iniciada por el usuario y esperada razonablemente.

          Antes de enviar el formulario, revisar nuevamente las dependencias y el comportamiento del AAB exacto.
          EOF

          cat > docs/sms-permission-declaration.md <<'EOF'
          # Declaración de permiso SEND_SMS — H.E.L.P

          **Permiso restringido solicitado:** android.permission.SEND_SMS

          **Caso de uso:** Physical safety / emergency alerts to send SMS.

          **Función principal:** H.E.L.P es una aplicación de seguridad personal. El usuario configura previamente uno o más contactos de confianza. Cuando mantiene presionado PEDIR AYUDA durante 3 segundos, la app envía automáticamente un SMS de emergencia a esos contactos con un enlace puntual de Google Maps y luego realiza la llamada configurada.

          **Por qué es esencial:** El envío automático es parte central de la función de emergencia. Reemplazarlo por un Intent de SMS requeriría interacción adicional del usuario y confirmación manual en otra app, reduciendo la utilidad en una emergencia.

          **Alcance mínimo:**
          - Solicita SEND_SMS, pero no READ_SMS, RECEIVE_SMS ni WRITE_SMS.
          - No lee mensajes.
          - El SMS se envía solo al activar explícitamente PEDIR AYUDA.
          - Los destinatarios son elegidos previamente por el usuario.
          - El contenido se limita al aviso de ayuda y ubicación puntual.
          - No hay publicidad ni uso comercial de SMS.
          - La excepción está sujeta a revisión y aprobación de Google Play.
          EOF

          cat > docs/subscription-setup.md <<'EOF'
          # Suscripción H.E.L.P — configuración en Play Console

          La app ya está preparada para Google Play Billing Library 9.1.0.

          ## Producto
          - Product ID: `help_monthly`
          - Tipo: Suscripción
          - Base plan sugerido: mensual con renovación automática
          - Precio: definir en Play Console
          - La app conserva el período local de 30 días del MVP.

          ## Seguridad
          El cliente consulta compras activas, restaura el derecho al abrir la app y reconoce compras iniciales.
          Para escalar y reducir fraude, Google recomienda validar compras y derechos en un backend seguro.
          EOF

          cat > docs/release-checklist.md <<'EOF'
          # Checklist H.E.L.P — Google Play

          ## Ya preparado
          - Nombre visible: H.E.L.P
          - Package/application ID definitivo: com.help.seguridad
          - compileSdk / targetSdk: 36
          - Ícono Android oficial
          - Ícono Play Store 512x512
          - Feature graphic 1024x500
          - Ficha de Play Store
          - Política de privacidad HTML
          - SMS de emergencia con Google Maps
          - Llamada directa
          - Selector de contactos
          - Sin seguimiento de ubicación continuo
          - Google Play Billing 9.1.0 integrado
          - Product ID esperado: help_monthly
          - Declaración SEND_SMS preparada
          - Guía de Data Safety preparada
          - Workflow de release firmado preparado

          ## Cuando Play Console habilite la cuenta
          1. Crear H.E.L.P usando package `com.help.seguridad`.
          2. Crear suscripción `help_monthly` y su base plan.
          3. Definir precio.
          4. Publicar la política de privacidad y cargar su URL.
          5. Completar App content, Data Safety y declaración SEND_SMS.
          6. Cargar secretos de firma en GitHub.
          7. Ejecutar workflow `Generar H.E.L.P release firmado`.
          8. Subir el AAB release a prueba interna/cerrada.
          9. Iniciar prueba cerrada con 12 testers durante 14 días continuos.
          EOF

          cat > .github/workflows/release-help-play.yml <<'YAML'
          name: Generar H.E.L.P release firmado

          on:
            workflow_dispatch:

          jobs:
            release:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"

                - uses: android-actions/setup-android@v3

                - run: sdkmanager "platforms;android-36"

                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.13"

                - name: Preparar upload key
                  shell: bash
                  env:
                    HELP_UPLOAD_KEYSTORE_B64: ${{ secrets.HELP_UPLOAD_KEYSTORE_B64 }}
                  run: |
                    set -e
                    if [ -z "$HELP_UPLOAD_KEYSTORE_B64" ]; then
                      echo "Falta el secreto HELP_UPLOAD_KEYSTORE_B64"
                      exit 1
                    fi
                    printf '%s' "$HELP_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/help-upload.jks"

                - name: Compilar release firmado
                  env:
                    HELP_KEYSTORE_PATH: ${{ runner.temp }}/help-upload.jks
                    HELP_KEYSTORE_PASSWORD: ${{ secrets.HELP_KEYSTORE_PASSWORD }}
                    HELP_KEY_ALIAS: ${{ secrets.HELP_KEY_ALIAS }}
                    HELP_KEY_PASSWORD: ${{ secrets.HELP_KEY_PASSWORD }}
                  run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

                - uses: actions/upload-artifact@v4
                  with:
                    name: HELP-RELEASE-FIRMADO
                    path: |
                      app/build/outputs/bundle/release/app-release.aab
                      app/build/outputs/apk/release/app-release.apk
                      play-store/icon-512.png
                      play-store/feature-graphic-1024x500.png
                      docs/privacy.html
          YAML

      - name: Verificar preparación
        shell: bash
        run: |
          set -e
          grep -q 'namespace = "com.help.seguridad"' app/build.gradle.kts
          grep -q 'applicationId = "com.help.seguridad"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'com.android.billingclient:billing:9.1.0' app/build.gradle.kts
          grep -q 'package com.help.seguridad' app/src/main/java/com/help/seguridad/MainActivity.kt
          grep -q 'SUBSCRIPTION_PRODUCT_ID = "help_monthly"' app/src/main/java/com/help/seguridad/BillingManager.kt
          grep -q 'Physical safety / emergency alerts' docs/sms-permission-declaration.md
          grep -q 'android.permission.SEND_SMS' app/src/main/AndroidManifest.xml
          test ! -f app/src/main/java/com/cerca/mvp/MainActivity.kt
          test -f docs/privacy.html
          test -f .github/workflows/release-help-play.yml

      - name: Compilar versión preparada
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Guardar cambios en main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/release-help-play.yml docs
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "Preparar H.E.L.P para Google Play"
            git push origin main
          fi

      - name: Subir paquete de validación
        uses: actions/upload-artifact@v4
