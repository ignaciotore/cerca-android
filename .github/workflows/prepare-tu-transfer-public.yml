name: Preparar Tu Transfer público

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-tu-transfer-public.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar versión productiva actual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tu-transfer
          mkdir -p tu-transfer/admin
          base="https://tu-transfer.vercel.app"
          curl -fsSL "$base/" -o tu-transfer/index.html
          curl -fsSL "$base/admin" -o tu-transfer/admin/index.html
          for f in styles.css core.js admin.js pwa.js manifest.webmanifest sw.js icon.svg; do
            curl -fsSL "$base/$f" -o "tu-transfer/$f"
          done

      - name: Agregar Compartir y preparar bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.parse

          root=Path("tu-transfer")
          index=(root/"index.html").read_text()
          admin=(root/"admin/index.html").read_text()
          styles=(root/"styles.css").read_text()
          core=(root/"core.js").read_text()
          adminjs=(root/"admin.js").read_text()
          icon=(root/"icon.svg").read_text()

          share='''<button id="shareAppBtn" class="btn light sm shareBtn" type="button" aria-label="Compartir Tu Transfer" title="Compartir Tu Transfer"><svg class="shareIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.7l6.8-4.1M8.6 13.3l6.8 4.1"></path></svg><span>Compartir</span></button>'''

          def patch_html(s,prefix):
              if 'id="shareAppBtn"' not in s:
                  s=s.replace('<button id="installAppBtn"',share+'<button id="installAppBtn"',1)
              repl={
                'href="/manifest.webmanifest"':f'href="{prefix}manifest.webmanifest"',
                'href="/icon.svg"':f'href="{prefix}icon.svg"',
                'href="/styles.css"':f'href="{prefix}styles.css"',
                'src="/icon.svg"':f'src="{prefix}icon.svg"',
                'src="/core.js"':f'src="{prefix}core.js"',
                'src="/admin.js"':f'src="{prefix}admin.js"',
                'src="/pwa.js"':f'src="{prefix}pwa.js"',
                'href="/"':f'href="{prefix}"'
              }
              for a,b in repl.items():
                  s=s.replace(a,b)
              return s

          index=patch_html(index,"./")
          admin=patch_html(admin,"../")
          styles += '''
          .shareBtn{display:inline-flex;align-items:center;gap:7px}
          .shareIcon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
          @media(max-width:600px){.topActions{gap:6px}.shareBtn{order:3;padding:9px 11px}.shareBtn span{display:none}.shareIcon{width:20px;height:20px}}
          '''

          pwa=r'''(() => {
            const shareBtn=document.getElementById('shareAppBtn');
            if(shareBtn){
              if(location.pathname.includes('/admin')) shareBtn.style.display='none';
              else shareBtn.addEventListener('click',async()=>{
                const url=location.href.split('#')[0].split('?')[0];
                const data={title:'Tu Transfer',text:'Cotizá y reservá tu traslado con Tu Transfer.',url};
                try{
                  if(navigator.share){await navigator.share(data);return;}
                  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);}
                  else{
                    const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
                    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove();
                  }
                  alert('Link de Tu Transfer copiado. Ya podés compartirlo.');
                }catch(e){
                  if(e&&e.name==='AbortError')return;
                  prompt('Copiá este link para compartir Tu Transfer:',url);
                }
              });
            }
            const installBtn=document.getElementById('installAppBtn');
            if(!installBtn)return;
            if(location.pathname.includes('/admin')){installBtn.style.display='none';return;}
            const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
            if(standalone){installBtn.style.display='none';return;}
            let deferredPrompt=null;
            const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
            if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
            window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-flex';installBtn.textContent='Instalar app';});
            if(isiOS){installBtn.style.display='inline-flex';installBtn.textContent='Agregar a inicio';}
            installBtn.addEventListener('click',async()=>{
              if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice.catch(()=>{});deferredPrompt=null;installBtn.style.display='none';return;}
              if(isiOS){alert('En iPhone/iPad: tocá Compartir en Safari y elegí “Agregar a pantalla de inicio”.');return;}
              alert('Abrí el menú del navegador y elegí “Instalar app” o “Agregar a pantalla principal”.');
            });
          })();'''

          (root/"index.html").write_text(index)
          (root/"admin/index.html").write_text(admin)
          (root/"styles.css").write_text(styles)
          (root/"pwa.js").write_text(pwa)
          (root/"admin.js").write_text(adminjs.replace("location.pathname.startsWith('/admin')","location.pathname.includes('/admin')"))

          m=json.loads((root/"manifest.webmanifest").read_text())
          m["start_url"]="./"
          m["scope"]="./"
          for x in m.get("icons",[]):
              if str(x.get("src","")).startswith("/"): x["src"]="."+x["src"]
          (root/"manifest.webmanifest").write_text(json.dumps(m,ensure_ascii=False,indent=2))

          sw=(root/"sw.js").read_text().replace("tu-transfer-v3","tu-transfer-v5").replace("tu-transfer-v4","tu-transfer-v5")
          (root/"sw.js").write_text(sw)

          icon_data="data:image/svg+xml;charset=utf-8,"+urllib.parse.quote(icon,safe="")
          bundle=(root/"index.html").read_text()
          bundle=bundle.replace('<link rel="manifest" href="./manifest.webmanifest">','')
          bundle=bundle.replace('<link rel="icon" type="image/svg+xml" href="./icon.svg">',f'<link rel="icon" href="{icon_data}">')
          bundle=bundle.replace('<link rel="stylesheet" href="./styles.css">',f'<style>{styles}</style>')
          bundle=bundle.replace('src="./icon.svg"',f'src="{icon_data}"')
          bundle=bundle.replace('<script src="./core.js"></script>',f'<script>{core.replace("</script","<\\/script")}</script>')
          bundle=bundle.replace('<script src="./admin.js"></script>',f'<script>{adminjs.replace("</script","<\\/script")}</script>')
          bundle=bundle.replace('<script src="./pwa.js"></script>',f'<script>{pwa.replace("</script","<\\/script")}</script>')
          Path("tu-transfer-import.html").write_text(bundle)
          PY

      - name: Guardar archivos en GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tu-transfer tu-transfer-import.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Tu Transfer: versión pública con Compartir"
            git push
          fi
