name: Generar H.E.L.P release firmado

# CERCA 9.2.3 · llamada SOS nativa independiente del deploy web
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-help-play.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Preparar upload key
        shell: bash
        env:
          HELP_UPLOAD_KEYSTORE_B64: ${{ secrets.HELP_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$HELP_UPLOAD_KEYSTORE_B64"
          printf '%s' "$HELP_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/help-upload.jks"
      - name: Compilar release firmado
        env:
          HELP_KEYSTORE_PATH: ${{ runner.temp }}/help-upload.jks
          HELP_KEYSTORE_PASSWORD: ${{ secrets.HELP_KEYSTORE_PASSWORD }}
          HELP_KEY_ALIAS: ${{ secrets.HELP_KEY_ALIAS }}
          HELP_KEY_PASSWORD: ${{ secrets.HELP_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Preparar APK CERCA 9.2.3
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CERCA-9.2.3.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CERCA-9.2.3-FIRMADA
          path: |
            app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/CERCA-9.2.3.apk
      - name: Publicar descarga directa en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view cerca-9.2.3 >/dev/null 2>&1; then
            gh release upload cerca-9.2.3 "$RUNNER_TEMP/CERCA-9.2.3.apk" --clobber
          else
            gh release create cerca-9.2.3 "$RUNNER_TEMP/CERCA-9.2.3.apk" --title "CERCA 9.2.3" --notes "Llamada SOS Android desacoplada del deploy web: la app nativa recupera la sesión directamente del WebView y ejecuta ACTION_CALL."
          fi