name: Firmar CERCA SOS para iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-shortcuts/CERCA-SOS.shortcut.plist'
      - '.github/workflows/sign-ios-shortcut.yml'

permissions:
  contents: write

concurrency:
  group: cerca-ios-shortcut-sign
  cancel-in-progress: false

jobs:
  sign-shortcut:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar archivo del atajo
        run: |
          mkdir -p build
          plutil -lint ios-shortcuts/CERCA-SOS.shortcut.plist
          plutil -convert binary1 ios-shortcuts/CERCA-SOS.shortcut.plist -o build/CERCA-SOS.unsigned.shortcut

      - name: Firmar para cualquier usuario
        shell: bash
        run: |
          set -euo pipefail

          if shortcuts sign --mode anyone --input build/CERCA-SOS.unsigned.shortcut --output build/CERCA-SOS.shortcut 2>/tmp/cerca-sign-error.log; then
            echo 'Firma nativa Apple completada.'
          else
            echo 'Runner sin sesión iCloud; usando RoutineHub HubSign.'
            cat /tmp/cerca-sign-error.log || true
            python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path('ios-shortcuts/CERCA-SOS.shortcut.plist').read_text(encoding='utf-8')
          Path('build/hubsign-request.json').write_text(
              json.dumps({'shortcutName': 'CERCA SOS', 'shortcut': src}, ensure_ascii=False),
              encoding='utf-8'
          )
          PY
            curl --fail --silent --show-error --location \
              'https://hubsign.routinehub.services/sign' \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: cherri/2.0.0' \
              --data-binary @build/hubsign-request.json \
              --output build/CERCA-SOS.shortcut
          fi

          test -s build/CERCA-SOS.shortcut
          MAGIC="$(xxd -p -l 4 build/CERCA-SOS.shortcut | tr '[:lower:]' '[:upper:]')"
          echo "Magic: $MAGIC"
          test "$MAGIC" = '41454131'

      - name: Publicar atajo firmado en CERCA
        shell: bash
        run: |
          set -euo pipefail
          cp build/CERCA-SOS.shortcut cerca-web/CERCA-SOS.shortcut
          git config user.name 'CERCA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cerca-web/CERCA-SOS.shortcut
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi

          git commit -m 'CERCA: publicar Atajo iPhone firmado'
          for intento in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Atajo firmado publicado.'
              exit 0
            fi
            echo "Push ocupado; reintentando ($intento/4)..."
            sleep 3
          done
          echo 'No se pudo publicar el Atajo firmado después de 4 intentos.' >&2
          exit 1

      - name: Subir respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CERCA-SOS-iPhone
          path: build/CERCA-SOS.shortcut
          if-no-files-found: error
