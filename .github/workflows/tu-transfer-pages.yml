name: Publicar Tu Transfer en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tu-transfer-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Tu Transfer
        shell: bash
        env:
          SHARE_URL: https://bhgmcqpjrlbsuaptfois.supabase.co/functions/v1/tu-transfer-live/
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site/tu-transfer/admin
          base="https://tu-transfer.vercel.app"
          curl -fsSL "$base/" -o pages-site/tu-transfer/index.html
          curl -fsSL "$base/admin" -o pages-site/tu-transfer/admin/index.html
          for f in styles.css core.js admin.js manifest.webmanifest sw.js icon.svg; do
            curl -fsSL "$base/$f" -o "pages-site/tu-transfer/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path("pages-site/tu-transfer")
          share=os.environ["SHARE_URL"]

          share_btn='''<button id="shareAppBtn" class="btn light sm shareBtn" type="button" aria-label="Compartir Tu Transfer" title="Compartir Tu Transfer"><svg class="shareIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.7l6.8-4.1M8.6 13.3l6.8 4.1"></path></svg><span>Compartir</span></button>'''

          def patch_html(path, prefix):
              s=path.read_text()
              if 'id="shareAppBtn"' not in s:
                  s=s.replace('<button id="installAppBtn"',share_btn+'<button id="installAppBtn"',1)
              s=s.replace('https://tu-transfer.vercel.app/',share)
              s=s.replace('href="/manifest.webmanifest"',f'href="{prefix}manifest.webmanifest"')
              s=s.replace('href="/icon.svg"',f'href="{prefix}icon.svg"')
              s=s.replace('href="/styles.css"',f'href="{prefix}styles.css"')
              s=s.replace('src="/icon.svg"',f'src="{prefix}icon.svg"')
              s=s.replace('src="/core.js"',f'src="{prefix}core.js"')
              s=s.replace('src="/admin.js"',f'src="{prefix}admin.js"')
              s=s.replace('src="/pwa.js"',f'src="{prefix}pwa.js"')
              s=s.replace('href="/"',f'href="{prefix}"')
              path.write_text(s)

          patch_html(root/"index.html","./")
          patch_html(root/"admin/index.html","../")

          css=(root/"styles.css").read_text()
          css+='''\n.shareBtn{display:inline-flex}.shareIcon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}@media(max-width:600px){.topActions{gap:6px}.shareBtn{order:3;padding:9px 11px}.shareBtn span{display:none}.shareIcon{width:20px;height:20px}}'''
          (root/"styles.css").write_text(css)

          admin=(root/"admin.js").read_text().replace("location.pathname.startsWith('/admin')","location.pathname.includes('/admin/')")
          (root/"admin.js").write_text(admin)

          pwa=f"""(() => {{
            const PUBLIC_URL={json.dumps(share)};
            const shareBtn=document.getElementById('shareAppBtn');
            if(shareBtn){{
              if(location.pathname.includes('/admin/')) shareBtn.style.display='none';
              else shareBtn.addEventListener('click',async()=>{{
                const data={{title:'Tu Transfer',text:'Cotizá y reservá tu traslado con Tu Transfer.',url:PUBLIC_URL}};
                try{{
                  if(navigator.share){{await navigator.share(data);return;}}
                  if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(PUBLIC_URL);
                  else{{const ta=document.createElement('textarea');ta.value=PUBLIC_URL;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();}}
                  alert('Link de Tu Transfer copiado. Ya podés compartirlo.');
                }}catch(e){{if(e&&e.name==='AbortError')return;prompt('Copiá este link para compartir Tu Transfer:',PUBLIC_URL);}}
              }});
            }}
            const installBtn=document.getElementById('installAppBtn');
            if(!installBtn)return;
            if(location.pathname.includes('/admin/')){{installBtn.style.display='none';return;}}
            const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
            if(standalone){{installBtn.style.display='none';return;}}
            let deferredPrompt=null;
            const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
            if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{{scope:'./'}}).catch(()=>{{}}));
            window.addEventListener('beforeinstallprompt',e=>{{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-flex';installBtn.textContent='Instalar app';}});
            if(isiOS){{installBtn.style.display='inline-flex';installBtn.textContent='Agregar a inicio';}}
            installBtn.addEventListener('click',async()=>{{
              if(deferredPrompt){{deferredPrompt.prompt();await deferredPrompt.userChoice.catch(()=>{{}});deferredPrompt=null;installBtn.style.display='none';return;}}
              if(isiOS){{alert('En iPhone/iPad: tocá Compartir en Safari y elegí “Agregar a pantalla de inicio”.');return;}}
              alert('Abrí el menú del navegador y elegí “Instalar app” o “Agregar a pantalla principal”.');
            }});
          }})();"""
          (root/"pwa.js").write_text(pwa)

          m=json.loads((root/"manifest.webmanifest").read_text())
          m["start_url"]="./?source=pwa"
          m["scope"]="./"
          for icon in m.get("icons",[]):
              if str(icon.get("src","")).startswith("/"):
                  icon["src"]="."+icon["src"]
          (root/"manifest.webmanifest").write_text(json.dumps(m,ensure_ascii=False,indent=2))

          sw="""const CACHE='tu-transfer-pages-v1';
          const BASE=self.registration.scope;
          const STATIC=['index.html','manifest.webmanifest','icon.svg','styles.css','core.js','admin.js','pwa.js'].map(x=>new URL(x,BASE).href);
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(STATIC)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;const u=new URL(r.url);if(!u.href.startsWith(BASE))return;if(r.mode==='navigate'){e.respondWith(fetch(r).then(res=>{const cp=res.clone();caches.open(CACHE).then(c=>c.put(r,cp));return res;}).catch(()=>caches.match(new URL('index.html',BASE).href)));return;}e.respondWith(caches.match(r).then(c=>c||fetch(r)));});"""
          (root/"sw.js").write_text(sw)
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
